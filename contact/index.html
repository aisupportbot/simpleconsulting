<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Booking | Simple Consulting</title><link rel="canonical" href="https://www.simpleconsulting.ca/booking.html"><script>
function scPreserveLandingQuery(target){
  try {
    var dest=new URL(target, location.origin);
    var here=new URL(location.href);
    here.searchParams.forEach(function(value, key){ if(!dest.searchParams.has(key)) dest.searchParams.append(key, value); });
    if(!dest.hash) dest.hash=here.hash;
    return dest.pathname+dest.search+dest.hash;
  } catch (e) { return target; }
}
location.replace(scPreserveLandingQuery("/booking.html"));
</script><meta http-equiv="refresh" content="0;url=/booking.html"></head><body><p>To get in touch, continue to <a href="/booking.html">Booking</a>.</p></body></html>
