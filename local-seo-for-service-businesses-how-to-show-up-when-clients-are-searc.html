function scPreserveLandingQuery(target){
  try {
    var dest=new URL(target, location.origin);
    var here=new URL(location.href);
    here.searchParams.forEach(function(value, key){ if(!dest.searchParams.has(key)) dest.searchParams.append(key, value); });
    if(!dest.hash) dest.hash=here.hash;
    return dest.pathname+dest.search+dest.hash;
  } catch (e) { return target; }
}
